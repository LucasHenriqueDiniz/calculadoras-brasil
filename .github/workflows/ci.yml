name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Every job repeats the same preamble on purpose: these are independent
# runners, and typecheck, lint and tests do not depend on one another.
# The build is NOT here — Workers Builds compiles and publishes on every push
# and reports back as a commit check. Running `vite build` here would discover
# the same thing twice.
# The pnpm action is given no 'version' — it reads the packageManager field of
# package.json, which is what keeps CI and local machines on the same version.

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

